name: Forward News
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_id.txt
          if ! git diff --staged --quiet; then
            git commit -m "update state"
            git fetch origin main
            git rebase -X theirs origin/main || (git rebase --abort; git reset --hard origin/main; git checkout --theirs . 2>/dev/null; true)
            git push origin HEAD:main
          fi
