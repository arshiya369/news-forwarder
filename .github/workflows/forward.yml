name: Forward News
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: forward-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: last_id.txt
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: python main.py
        env:
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}

      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: last_id.txt
          key: state-${{ github.run_id }}
